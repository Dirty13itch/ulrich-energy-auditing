[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ulrich-energy-auditing"
version = "0.1.0"
description = "Local-first CLI MVP for building energy audit analysis and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pypdf>=5.0", "pytest>=8.2"]

[project.scripts]
ulrich-energy-auditing = "ulrich_energy_auditing.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
